server {
    listen 80;
    listen [::]:80;
    server_name {{APP_DOMAIN}};

    # certbot --nginx rewrites this block to redirect to 443 and adds the
    # certificate directives. Until then this serves plain HTTP so the ACME
    # challenge can complete.

    root {{APP_DIR}}/current/public;
    index index.php;

    charset utf-8;
    client_max_body_size 64M;   # YNAB exports upload through here (50M limit in the request rules)

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Vite writes content-hashed filenames, so these can be cached indefinitely.
    location /build/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php{{PHP_VERSION}}-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;

        # Importing a large export parses and writes the whole file in one
        # request; the default 60s is not always enough.
        fastcgi_read_timeout 120;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    error_page 404 /index.php;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
